let score = {};
let currentQ = 0;
const dims = Object.keys(testData.explain);

function initScore(){
  dims.forEach(k=>score[k]=0);
}
function switchPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(name).classList.add('active');
}
function startTest(){
  initScore();
  currentQ = 0;
  document.getElementById('introText').innerText = testData.intro;
  renderQ();
  switchPage('quizPage');
}
function renderQ(){
  const q = testData.data[currentQ];
  document.getElementById('qIndex').innerText = currentQ+1;
  document.getElementById('qTotal').innerText = testData.data.length;
  document.getElementById('qTitle').innerText = q.title;
  const wrap = document.getElementById('optWrap');
  wrap.innerHTML = '';
  q.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.innerText = opt.text;
    btn.onclick = ()=>{
      for(const d in opt.delta) score[d] += opt.delta[d];
      currentQ++;
      if(currentQ >= testData.data.length){
        showResult();
      }else{
        renderQ();
      }
    }
    wrap.appendChild(btn);
  })
}
function dist(vecA, vecB){
  let s = 0;
  for(const k of dims){
    const a = vecA[k]||0;
    const b = vecB[k]||0;
    s += (a-b)*(a-b);
  }
  return Math.sqrt(s);
}
function showResult(){
  let list = testData.role.map(r=>({...r, d:dist(score, r.vec)}));
  list.sort((a,b)=>a.d - b.d);
  const top = list[0];
  document.getElementById('roleName').innerText = top.name;
  document.getElementById('roleDesc').innerText = top.desc;

  const barWrap = document.getElementById('barWrap');
  barWrap.innerHTML = '';
  const maxVal = 30;
  dims.forEach(key=>{
    const v = score[key];
    const pct = Math.max(0, Math.min(100, ((v + 15) / (maxVal+15)) * 100));
    const div = document.createElement('div');
    div.className = 'bar-row';
    div.innerHTML = `<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px;color:#c9b8e8"><span>${testData.explain[key].split('：')[0]}</span><span>${v}</span></div><div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>`;
    barWrap.appendChild(div);
  })

  const nearWrap = document.getElementById('nearWrap');
  nearWrap.innerHTML = '';
  for(let i=1;i<4;i++){
    const item = list[i];
    const d = document.createElement('div');
    d.className = "near-item";
    d.innerText = item.name;
    nearWrap.appendChild(d);
  }
  switchPage('resultPage');
}
function restart(){
  switchPage('introPage');
}
